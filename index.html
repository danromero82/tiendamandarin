        :root { --orange: #f97316; --dark: #1a1a1a; --card: #252525; }

        header { background-color: #222; padding: 20px; text-align: center; border-bottom: 3px solid var(--orange); position: sticky; top: 0; z-index: 100; }
        .logo-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid var(--orange); }
        h1 { margin: 10px 0; color: var(--orange); text-transform: uppercase; font-size: 1.8rem; }
        .menu-botones { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 15px; }

        button, .btn-link {
            background-color: #2a2a2a; color: white; border: 1px solid var(--orange);
            padding: 8px 15px; cursor: pointer; border-radius: 8px; font-weight: bold;
            transition: 0.3s; text-decoration: none; font-size: 0.8rem;
        }
        button:hover { background-color: var(--orange); color: #111; }

        #contenedor-principal { padding: 40px 20px; max-width: 1200px; margin: 0 auto; min-height: 400px; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .producto-card { background-color: var(--card); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #333; }
        .producto-card img { width: 100%; height: 180px; object-fit: contain; background: white; border-radius: 8px; }
        .producto-card h3 { color: var(--orange); margin: 12px 0; font-size: 1rem; }

        .btn-detalle { background: #444; border: none; width: 100%; color: white; padding: 8px; border-radius: 5px; cursor: pointer; margin-bottom: 5px; }
        .btn-whatsapp { background: #25d366; border: none; width: 100%; color: white; padding: 8px; border-radius: 5px; cursor: pointer; text-decoration: none; display: block; }

        .seccion-texto { max-width: 800px; margin: 0 auto; line-height: 1.6; text-align: center; }
        .orange { color: var(--orange); }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: var(--card); margin: 10% auto; padding: 25px; border-radius: 15px; max-width: 450px; border: 1px solid var(--orange); position: relative; }
        .close { position: absolute; right: 15px; top: 5px; font-size: 24px; cursor: pointer; color: var(--orange); }
    </style>

       function irAInicio() {

        function mostrarNosotros() {

                    <h2 class="orange">Sobre Nosotros</h2>
                    <p>Hace mas de 15 años nacimos con una idea muy simple pero que hoy en día cuesta encontrar: ofrecer la mejor tecnología importada y artículos para el hogar, con la atención transparente, honesta y sincera.</p>
                    <p>En Tienda Mandarin no nos interesa venderte por vender. Sabemos que cambiar el celular, elegir una computadora o equipar tu casa es una inversión importante. Por eso, nos tomamos el tiempo de escucharte, asesorarte y recomendarte exactamente lo que necesitás.</p>

                </div>`;
        }

      function filtrar(categoria) {
    const filtrados = productos.filter(p => p.cat === categoria);
    contenedor.innerHTML = '<div class="grid-productos"></div>';
    const grid = contenedor.querySelector('.grid-productos');

    filtrados.forEach(p => {
        // Esto arma el mensaje automático con el nombre exacto de cada producto
        const mensajeWa = encodeURIComponent(`Hola! Vengo de la pagina y me interesa el producto: ${p.nombre}`);

        grid.innerHTML += `
            <div class="producto-card">
                <img src="${p.img}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Foto'">
                <h3>${p.nombre}</h3>

                ${p.precio ? `
                    <div class="precio-contenedor" style="margin: 8px 0; font-family: sans-serif;">
                        <span style="font-size: 20px; font-weight: bold; color: #2ecc71;">$${Number(p.precio).toLocaleString('es-AR')}</span>
                        <p style="margin: 2px 0 0 0; font-size: 11px; color: #a0a0a0;">Efectivo / Transferencia</p>
                    </div>
                ` : ''}

                <button class="btn-detalle" style="margin-top: 5px;" onclick="verDetalles(${p.id})">Ver detalles</button>
                <a href="https://wa.me/5491136575450?text=${mensajeWa}" class="btn-whatsapp" target="_blank">Consultar</a>
            </div>
        `;
    });
}

function verDetalles(id) {
    const prod = productos.find(p => p.id === id);
    document.getElementById('modal-titulo').innerText = prod.nombre;
    document.getElementById('detalle-info').innerHTML = `<p>${prod.desc}</p>`;
    document.getElementById('miModal').style.display = 'block';
}
