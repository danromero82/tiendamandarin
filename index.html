<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Mandarín | Ya volvemos</title>
<meta name="theme-color" content="#e62219">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f7f7f7;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#151515;
  padding:25px;
}

.contenedor{
  max-width:750px;
  width:100%;
  background:white;
  border-radius:24px;
  padding:50px 35px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.10);
}

.icono{
  width:130px;
  height:130px;
  margin:0 auto 30px;
  border-radius:50%;
  background:#fff2f1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.marca{
  color:#e62219;
  font-weight:900;
  letter-spacing:3px;
  font-size:15px;
  margin-bottom:15px;
}

h1{
  font-size:42px;
  line-height:1.1;
  margin-bottom:14px;
}

h2{
  font-size:24px;
  color:#e62219;
  margin-bottom:22px;
}

p{
  color:#666;
  font-size:17px;
  line-height:1.6;
  max-width:520px;
  margin:0 auto;
}

.whatsapp{
  display:inline-block;
  margin-top:30px;
  padding:15px 25px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:800;
  font-size:16px;
}

.slogan{
  margin-top:35px;
  font-weight:800;
  font-size:16px;
}

.slogan span{
  color:#e62219;
}

@media(max-width:600px){

  .contenedor{
    padding:38px 22px;
  }

  .icono{
    width:105px;
    height:105px;
    font-size:52px;
  }

  h1{
    font-size:32px;
  }

  h2{
    font-size:21px;
  }

  p{
    font-size:15px;
  }
}
</style>

</head>

<body>

<div class="contenedor">

  <div class="marca">TIENDA MANDARÍN</div>

  <div class="icono">🛠️</div>

  <h1>Página en mantenimiento</h1>

  <h2>Ya volvemos</h2>

  <p>
    Estamos haciendo algunos ajustes para mejorar nuestra tienda.
    Mientras tanto, seguimos atendiendo normalmente por WhatsApp.
  </p>

  <a class="whatsapp"
     href="https://wa.me/5491176744455?text=Hola%21%20Quiero%20consultar%20por%20un%20producto."
     target="_blank">
     Consultar por WhatsApp
  </a>

  <div class="slogan">
    Mandarín. <span>Hacemos que pase.</span>
  </div>

</div>

</body>
</html>
